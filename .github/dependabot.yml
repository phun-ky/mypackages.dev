version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Minor and patch updates are grouped into one PR. Major updates are left
    # ungrouped, so each one gets its own PR that can be tested and merged alone.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    # Room for the grouped PR and a few majors at once
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
    ignore:
      # Keep @types/node on the Node major that CI runs (node-version in
      # .github/workflows). Bump it by hand when CI moves to a new major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Versions of the actions in .github/workflows. The Supabase CLI version
  # given to supabase/setup-cli is not covered, so bump that by hand.
  - package-ecosystem: 'github-actions'
    directory: '/'
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    labels:
      - 'mindless: 📦 dependencies'
      - 'section: workflows'
    commit-message:
      prefix: 'ci: 🎡 '
