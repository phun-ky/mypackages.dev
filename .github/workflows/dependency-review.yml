name: Dependency Review

# Check every pull request's dependency changes against the GitHub Advisory
# Database and the licences below. Policy: SECURITY.md
on:
  pull_request:
    branches: ['main']

# Read-only: the action compares dependencies through the API, no checkout
permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          # The licences in use when this was set up (2026-10-28). Copyleft
          # beyond LGPL is not accepted; a new licence is a decision, made in
          # the pull request that adds it.
          allow-licenses: >-
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause,
            CC-BY-4.0, CC0-1.0, ISC, LGPL-3.0, MIT, MPL-2.0, OFL-1.1, Unlicense
          # Licences without an SPDX identifier, to review by hand when they
          # change: format, which declares none. Highcharts, with its own
          # licence, left with the old dashboard (#78)
          allow-dependencies-licenses: >-
            pkg:npm/format
