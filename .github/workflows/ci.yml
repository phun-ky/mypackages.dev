name: CI

# No path filters: `check` is meant to be a required status check, and a
# workflow skipped by a path filter never reports it, which would block the
# pull request.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# A new push to a pull request cancels the run for the previous one
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-node only caches automatically when package.json has a
      # packageManager field, so it is set explicitly
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck # Source and tests, see tsconfig.json
        run: npm run typecheck
      # actionlint checks the workflows, and their run: blocks with the
      # runner's shellcheck. Dependabot doesn't update it: bump the version
      # and checksum by hand, from the release's checksums.txt.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same build as the deploy, without the Supabase settings. The e2e
      # job checks that the site runs, with the settings in .env.e2e.
      - name: Build
        run: npm run build
      - name: Check output
        run: |
          for file in index.html 404.html; do
            test -f "dist/$file" || { echo "dist/$file is missing"; exit 1; }
          done

  e2e:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Report both browsers, even if one fails
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Builds with .env.e2e first, see the pretest:e2e script
      - name: Run Playwright tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  functions:
    name: Supabase functions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The edge runtime runs Deno 2, see supabase/config.toml
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
      - name: Typecheck
        run: deno check --no-lock supabase/functions/*/index.ts
      # The functions import supabase-js by URL and use `any` in two places,
      # as deployed. Moving the imports to an import map and removing `any`
      # changes the deployed code, so it is done separately.
      - name: Lint
        run:
          deno lint --rules-exclude=no-import-prefix,no-explicit-any
          supabase/functions
      # Unit and property tests, like those for the portfolio snapshot. The
      # functions aren't part of the site's npm project: without this, Deno
      # reads package.json and looks for types in a node_modules folder that
      # this job doesn't install.
      # The handler tests set the functions' environment and import them
      - name: Test
        run:
          deno test --no-lock --allow-env --allow-read=supabase/functions
          supabase/functions
        env:
          DENO_NO_PACKAGE_JSON: 1

  database:
    name: Database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      # A local database only. Never --linked here: that is production.
      - name: Start a local database
        run: supabase db start
      - name: Apply the migrations to an empty database
        run: supabase db reset --local
      - name: Test what the anon key and users can do
        run: supabase test db --local
      - name: Lint functions in the database
        run: supabase db lint --local --fail-on error
      - name: Check the security advisors
        run: supabase db advisors --local --type security --fail-on error

  # The status check to require for pull requests. Add new jobs to `needs`.
  check:
    name: check
    # Not always(): a run cancelled by a newer push shouldn't report a failure
    if: ${{ !cancelled() }}
    needs: [lint, build, e2e, functions, database]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that all jobs passed
        env:
          FAILED:
            ${{ contains(needs.*.result, 'failure') || contains(needs.*.result,
            'cancelled') || contains(needs.*.result, 'skipped') }}
          RESULTS:
            lint=${{ needs.lint.result }} build=${{ needs.build.result }}
            e2e=${{ needs.e2e.result }} functions=${{ needs.functions.result }}
            database=${{ needs.database.result }}
        run: |
          echo "$RESULTS"
          [ "$FAILED" = "false" ]

  # Pull requests show their failures, so only open an issue for main
  notify:
    name: Notify failed check
    needs: check
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          label-name: 'problems: 💔 build failed'
          # Don't recreate the label if it's renamed or removed
          create-label: false
