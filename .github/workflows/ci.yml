name: CI

# No path filters: `check` is meant to be a required status check, and a
# workflow skipped by a path filter never reports it, which would block the
# pull request.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# A new push to a pull request cancels the run for the previous one
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-node only caches automatically when package.json has a
      # packageManager field, so it is set explicitly
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck # Source and tests, see tsconfig.json
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same build as the deploy, without the Supabase settings. The e2e
      # job checks that the site runs, with the settings in .env.e2e.
      - name: Build
        run: npm run build
      - name: Check output
        run: |
          for file in index.html 404.html; do
            test -f "dist/$file" || { echo "dist/$file is missing"; exit 1; }
          done

  e2e:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Report both browsers, even if one fails
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Builds with .env.e2e first, see the pretest:e2e script
      - name: Run Playwright tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  functions:
    name: Supabase functions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The edge runtime runs Deno 2, see supabase/config.toml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
      - name: Typecheck
        run: deno check --no-lock supabase/functions/*/index.ts
      # The functions import supabase-js by URL and use `any` in two places,
      # as deployed. Moving the imports to an import map and removing `any`
      # changes the deployed code, so it is done separately.
      - name: Lint
        run:
          deno lint --rules-exclude=no-import-prefix,no-explicit-any
          supabase/functions
      # Unit and property tests, like those for the portfolio snapshot
      - name: Test
        run: deno test --no-lock supabase/functions

  database:
    name: Database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      # A local database only. Never --linked here: that is production.
      - name: Start a local database
        run: supabase db start
      - name: Apply the migrations to an empty database
        run: supabase db reset --local
      - name: Test what the anon key and users can do
        run: supabase test db --local
      - name: Lint functions in the database
        run: supabase db lint --local --fail-on error
      - name: Check the security advisors
        run: supabase db advisors --local --type security --fail-on error

  # The status check to require for pull requests. Add new jobs to `needs`.
  check:
    name: check
    # Not always(): a run cancelled by a newer push shouldn't report a failure
    if: ${{ !cancelled() }}
    needs: [lint, build, e2e, functions, database]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that all jobs passed
        env:
          FAILED:
            ${{ contains(needs.*.result, 'failure') || contains(needs.*.result,
            'cancelled') || contains(needs.*.result, 'skipped') }}
          RESULTS:
            lint=${{ needs.lint.result }} build=${{ needs.build.result }}
            e2e=${{ needs.e2e.result }} functions=${{ needs.functions.result }}
            database=${{ needs.database.result }}
        run: |
          echo "$RESULTS"
          [ "$FAILED" = "false" ]

  # Pull requests show their failures, so only open an issue for main
  notify:
    name: Notify failed check
    needs: check
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@v1
        with:
          label-name: 'problems: 💔 build failed'
