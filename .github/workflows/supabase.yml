name: Deploy Supabase functions

# A path filter is fine here: this workflow isn't a required status check
on:
  push:
    branches: ['main']
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

# Don't cancel a deploy in progress, but skip runs queued behind it
concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds SUPABASE_ACCESS_TOKEN. Limit it to main in the repository settings.
    environment: supabase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      # Deploys every function in supabase/functions, with the settings in
      # supabase/config.toml. No --prune: functions that only exist in the
      # project are left alone.
      - name: Deploy functions
        run: supabase functions deploy --use-api --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: zendzcuvkwbszzyjfefa

  notify:
    name: Notify failed deploy
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          label-name: 'problems: 💔 build failed'
          # Don't recreate the label if it's renamed or removed
          create-label: false
