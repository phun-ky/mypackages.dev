'section: tests':
  - any:
      - head-branch: ['^test/']
      - changed-files:
          - any-glob-to-any-file:
              - 'tests/**'
              - 'playwright.config.mjs'

'section: workflows':
  - any:
      - head-branch: ['^ci/']
      - changed-files:
          - any-glob-to-any-file:
              - '.github/workflows/**'

# Files in the root of the repository
'section: repo':
  - changed-files:
      - any-glob-to-any-file:
          - '*'

'experience: developer':
  - changed-files:
      - any-glob-to-any-file:
          - '.editorconfig'
          - '.gitignore'
          - '.prettierrc'
          - 'eslint.config.mjs'
          - 'tsconfig*.json'
          - 'vite.config.ts'

'context: github':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.md'

'mindless: 📦 dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'package-lock.json'

'✨ feature':
  - head-branch: ['^feat/']

'problems: 🐛 bug':
  - head-branch: ['^fix/']

'mindless: 🤖 chore':
  - head-branch: ['^chore/']
