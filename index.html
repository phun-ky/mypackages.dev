<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Alexander Vassbotn Røyne-Helgesen" />
    <!--
      The Content Security Policy, as a meta tag since GitHub Pages can't send
      headers; that also means it can't set frame-ancestors or reporting.
      Scripts come only from the site; 'wasm-unsafe-eval' is for Shiki's
      highlighter. Style attributes may be inline (the templates, Shiki and
      Highcharts set them), style elements may not. connect-src lists the APIs
      the browser calls, tested in tests/e2e/csp.e2e.ts. In development,
      vite.config.ts allows the style elements Vite injects.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
    base-uri 'self';
    form-action 'self';
    object-src 'none';
    script-src 'self' 'wasm-unsafe-eval';
    style-src 'self';
    style-src-attr 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: https://avatars.githubusercontent.com https://www.gravatar.com;
    connect-src 'self'
      https://zendzcuvkwbszzyjfefa.supabase.co
      https://api.github.com
      https://gitlab.com
      https://api.bitbucket.org
      https://dev.azure.com
      https://api.osv.dev;
    upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="shortcut icon" href="/meta/favicon.ico?v2" />
    <link
      rel="icon"
      type="image/png"
      href="/meta/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/meta/favicon.svg" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/meta/apple-touch-icon.png"
    />
    <link rel="manifest" href="/meta/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My packages</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div class="loader-container" id="loader-container">
      <div class="loader" id="loader"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
